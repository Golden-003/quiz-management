<style>

.big{font-size:44px;font-weight:700;margin:4px 0}
.err{font:15px system-ui,sans-serif;border-top:1px solid var(--line);padding:10px 0}
select{font:16px system-ui,sans-serif;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);width:100%;margin-bottom:12px}

<script>
const Q=[],X="Aucune réponse";

 app.append(h("div","meta",(S.n+1)+"/"+S.ids.length+" · "+q.s+" · "+K[q.y||q.k]),bar);
 const c=h("div","card");c.append(h("p","q",q.q));if(q.k=="m")c.append(h("div","meta","Coche toutes les bonnes réponses, puis valide."));
 if(q.k=="o"){askO(c,q,id);return}
 let done=false;const pk=new Set();let val;
 const bs=q.o.map((o,k)=>h("button","",(q.k=="v"?"":String.fromCharCode(97+k)+") ")+o,()=>{
  if(done)return;
  if(q.k=="m"){pk.has(k)?pk.delete(k):pk.add(k);bs[k].classList.toggle("sel")}else fin([k]);
 }));
 bs.forEach(b=>c.append(b));
 function fin(p){
  done=true;if(val)val.remove();
  const ok=p.length==q.a.length&&p.every(x=>q.a.includes(x));
  bs.forEach((b,k)=>{b.classList.remove("sel");if(q.a.includes(k))b.classList.add("ok");else if(p.includes(k))b.classList.add("ko")});
  let e=errs();if(ok){S.ok++;e=e.filter(x=>x!=id)}else{S.bad.push(id);if(!e.includes(id))e.push(id)}ls.s(EK,e);
  c.append(h("div","ex",(ok?"Correct. ":"Faux. ")+"Réponse : "+ansTxt(q)+(q.e?" — "+q.e:"")+(q.dd?" Réponse déduite du cours, absente de ta clé.":"")),
   h("button","p",S.n+1<S.ids.length?"Question suivante":"Voir le résultat",()=>{S.n++;S.n<S.ids.length?ask():end()}));
 }
 if(q.k=="m"){val=h("button","p","Valider",()=>{if(!done&&pk.size)fin([...pk])});c.append(val)}
 app.append(c);
}
function end(){
 app.replaceChildren();const p=Math.round(S.ok/S.ids.length*100),c=h("div","card");
 c.append(h("div","meta","Résultat"),h("div","big",S.ok+" / "+S.ids.length+" ("+p+" %)"),h("p","s",p>=80?"Solide. Refais tes erreurs restantes.":p>=60?"Correct. Refais tes erreurs.":"À retravailler : relis les corrigés puis recommence."));
 if(S.bad.length){c.append(h("div","meta","À revoir"));S.bad.forEach(i=>{const q=Q[i],e=h("div","err");e.append(h("b",0,q.q),h("div",0,"Réponse : "+ansTxt(q)+(q.e?" — "+q.e:"")+(q.dd?" Réponse déduite du cours, absente de ta clé.":"")));c.append(e)})}
 c.append(h("button","p","Refaire mes erreurs",()=>{sel="err";typ="all";start()}),h("button",0,"Accueil",home));app.append(c);
}
home();
